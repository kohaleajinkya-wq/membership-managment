<h1 class="h4 mb-1">Settings</h1>
<p class="text-muted small mb-3">Branding, tax, and notification defaults (front-end demo — persist via your API).</p>

<div class="card shadow-sm" style="max-width: 520px">
  <div class="card-body">
    <div class="form-group">
      <label class="small font-weight-bold">Gym name</label>
      <input class="form-control form-control-sm" [(ngModel)]="gymName" name="gn" />
    </div>
    <div class="form-group">
      <label class="small font-weight-bold">Reminder before expiry (days)</label>
      <input type="number" class="form-control form-control-sm" [(ngModel)]="reminderDays" name="rd" />
    </div>
    <div class="form-group">
      <label class="small font-weight-bold">Tax % on invoices</label>
      <input type="number" class="form-control form-control-sm" [(ngModel)]="taxPercent" name="tx" />
    </div>
    <button type="button" class="btn btn-primary btn-sm" disabled>Save (wire to API)</button>
  </div>
</div>
