<div class="fp-wrap d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm fp-card">
    <div class="card-body p-4">
      <h1 class="h5 mb-3">Reset password</h1>
      <p class="text-muted small">
        Demo only: connect this form to your backend email / SMS flow. Enter your account email to receive a reset link.
      </p>
      <div class="form-group">
        <label class="small font-weight-bold">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" />
      </div>
      <button type="button" class="btn btn-primary btn-block" (click)="submit()">Send reset link</button>
      <div class="alert alert-success small mt-3 mb-0" *ngIf="sent">If that email exists, a link was sent (demo message).</div>
      <a routerLink="/login" class="d-block text-center small mt-3">Back to login</a>
    </div>
  </div>
</div>
